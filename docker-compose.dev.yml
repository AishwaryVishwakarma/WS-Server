# Local development infrastructure. Runs on alternate ports (Postgres 3310,
# Redis 6380) so it can coexist with natively installed Postgres/Redis — point
# .env at it to use it (see README "Development database").
services:
  postgres-dev:
    image: postgres:16
    container_name: ws-postgres-dev
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ws_dev
    ports:
      - '3310:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'root']
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ws-postgres-dev-data:/var/lib/postgresql/data

  redis-dev:
    image: redis:7
    container_name: ws-redis-dev
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  ws-postgres-dev-data:
