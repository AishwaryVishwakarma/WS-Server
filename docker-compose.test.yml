services:
  postgres-test:
    image: postgres:16
    container_name: ws-postgres-test
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ws_test
    ports:
      - '3311:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'root']
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7
    container_name: ws-redis-test
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30
